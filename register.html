<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - Alumni Network</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Register for Alumni Network</h1>
  </header>

  <div class="container"  style="margin-top: 80px; width: 30%;">
    <form>
      <label for="reg-name">Name:</label>
      <input type="text" id="reg-name" required><br><br>

      <label for="reg-email">Email:</label>
      <input type="email" id="reg-email" required><br><br>

      <label for="reg-password">Password:</label>
      <input type="password" id="reg-password" required><br><br>

      <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a href="login.html">Login here</a>.</p>
  </div>

  <footer class="log-footer">
    <p>&copy; 2025 Alumni Network. All rights reserved.</p>
  </footer>
</body>
</html>
