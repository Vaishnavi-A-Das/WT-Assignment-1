<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register as a Mentee</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Mentee Registration</h1>
    <p>Looking for guidance? Connect with a mentor from our alumni network.</p>
  </header>

  <form action="submit_mentee.php" method="post">
    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name" required><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required><br>

    <label for="phone">Phone Number:</label>
    <input type="tel" id="phone" name="phone" required><br>

    <label for="interest">Areas of Interest:</label>
    <input type="text" id="interest" name="interest" required><br>

    <label for="year">Current Year of Study:</label>
    <input type="text" id="year" name="year" required><br>

    <label for="goal">What do you seek in a mentor?</label>
    <textarea id="goal" name="goal" rows="4" required></textarea><br>

    <button type="submit">Register</button>
  </form>
</body>
</html>
