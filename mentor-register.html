<!-- mentor-register.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register as a Mentor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Mentor Registration</h1>
    <p>Join our mentorship program and guide the next generation of alumni!</p>
  </header>

  <form action="submit_mentor.php" method="post">
    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name" required><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required><br>

    <label for="phone">Phone Number:</label>
    <input type="tel" id="phone" name="phone" required><br>

    <label for="experience">Field of Expertise:</label>
    <input type="text" id="experience" name="experience" required><br>

    <label for="batch">Year of Graduation:</label>
    <input type="number" id="batch" name="batch" required><br>

    <label for="bio">Short Bio:</label>
    <textarea id="bio" name="bio" rows="4" required></textarea><br>

    <button type="submit">Register</button>
  </form>
</body>
</html>
